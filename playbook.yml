---
- name: "Set user home directory fact"
  hosts: local
  connection: local
  gather_facts: false
  roles:
    - user_home

- name: "Configure Ubuntu 24.04"
  hosts: local
  connection: local
  roles:
    - aws_cliv2
    - role: dotfiles
      vars:
        dotfiles_repo_branch: master
        dotfiles_repo_url: https://github.com/liyier90/dotfiles.git
        dotfiles_pip_index_url: https://pypi.org/simple
    - umask
    - role: docker
      become: true
      vars:
        docker_repo_url: https://download.docker.com/linux/ubuntu
    - role: node
      vars:
        node_nvm_nodejs_org_mirror: https://nodejs.org/dist
    - role: rust
      vars:
        rust_rustup_url: https://sh.rustup.rs
    - neovim
